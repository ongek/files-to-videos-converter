name: "Native Mac ARM64 Lightweight Build"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build JAR (Mac ARM64)
    runs-on: macos-latest
    env:
      AV_LOG_FORCE_NOCOLOR: 1

    steps:
    # 1. checkout を v5 に更新 (Node.js 24 対応)
    - name: Checkout repository
      uses: actions/checkout@v5

    # 2. setup-java を v5 に更新 (Node.js 24 対応)
    - name: Setup Java JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    # =================================================================
    # 往復エンコード・デコード整合性確認フェーズ (30MB & デバッグログ強化)
    # =================================================================
    - name: Prepare Integrity Test Workspace
      run: |
        mkdir -p test_workspace/in
        dd if=/dev/urandom of=test_workspace/in/integrity_test_source.dat bs=1024 count=30720
        echo "=== SOURCE FILE SHA-256 ==="
        shasum -a 256 test_workspace/in/integrity_test_source.dat | tee test_workspace/source_hash.txt
        
    - name: Execute Files-To-Videos Conversion (Encode)
      env:
        FFMPEG_ALLOW_SW: "1"
      run: |
        java --enable-native-access=ALL-UNNAMED -jar -Xmx2048m -Xms2048m target/FilesToVideosConverter.jar -ftv -fp test_workspace/in -t 1
        echo "=== ENCODE COMPLETED ==="
        VIDEO_DIR=$(ls -d resultVideos* | head -n 1)
        echo "VIDEO_DIR=$VIDEO_DIR" >> $GITHUB_ENV
        echo "=== CHECK GENERATED VIDEO DETAILS ==="
        ls -la "$VIDEO_DIR"
        
    - name: Execute Videos-To-Files Conversion (Decode)
      run: |
        echo "=== STARTING DECODE ==="
        echo "Target Video Directory: ${{ env.VIDEO_DIR }}"
        java --enable-native-access=ALL-UNNAMED -jar -Xmx2048m -Xms2048m target/FilesToVideosConverter.jar -vtf -vp "${{ env.VIDEO_DIR }}" -t 1
        echo "=== DECODE PROCESS FINISHED ==="
        echo "=== FULL DIRECTORY TREE RE-CHECK ==="
        ls -la
        RESTORED_PATH=$(find resultFiles* -name "integrity_test_source.dat" 2>/dev/null | head -n 1)
        if [ -z "$RESTORED_PATH" ]; then
          echo "❌ ERROR: Restored file was not found."
          echo "Let's check if any resultFiles directory exists at all:"
          ls -ld resultFiles* || echo "No resultFiles directory found."
          exit 1
        fi
        echo "Found Real Restored File At: $RESTORED_PATH"
        echo "RESTORED_FILE_PATH=$RESTORED_PATH" >> $GITHUB_ENV
        
    - name: Strict Integrity Verification (SHA-256 & Bit-level Check)
      run: |
        SRC_FILE="test_workspace/in/integrity_test_source.dat"
        REST_FILE="${{ env.RESTORED_FILE_PATH }}"

        # 1. ファイルサイズの取得
        SRC_SIZE=$(wc -c < "$SRC_FILE" | tr -d ' ')
        REST_SIZE=$(wc -c < "$REST_FILE" | tr -d ' ')

        # 2. SHA-256 ハッシュの算出
        SRC_HASH=$(shasum -a 256 "$SRC_FILE" | awk '{print $1}')
        REST_HASH=$(shasum -a 256 "$REST_FILE" | awk '{print $1}')

        echo "=================================================="
        echo "=== INTEGRITY VERIFICATION REPORT ==="
        echo "=================================================="
        echo "Source File   : $SRC_FILE"
        echo "Restored File : $REST_FILE"
        echo "--------------------------------------------------"
        echo "Source Size   : $SRC_SIZE bytes"
        echo "Restored Size : $REST_SIZE bytes"
        echo "--------------------------------------------------"
        echo "Source SHA256 : $SRC_HASH"
        echo "Restored SHA256: $REST_HASH"
        echo "=================================================="

        # 3. サイズとハッシュの完全一致判定
        if [ "$SRC_SIZE" -eq "$REST_SIZE" ] && [ "$SRC_HASH" = "$REST_HASH" ]; then
          echo "✅ INTEGRITY PASSED: Files are 100% identical at bit-level!"
          exit 0
        else
          echo "❌ INTEGRITY FAILED: Bit mismatch detected!"

          if [ "$SRC_SIZE" -ne "$REST_SIZE" ]; then
            echo "⚠️ [Cause 1] File size mismatch! (Diff: $((REST_SIZE - SRC_SIZE)) bytes)"
          fi

          echo "--------------------------------------------------"
          echo "=== 1. First mismatched byte location (cmp) ==="
          cmp -l "$SRC_FILE" "$REST_FILE" | head -n 10 || true

          echo "--------------------------------------------------"
          echo "=== 2. Hex diff of FIRST 128 bytes ==="
          diff -u <(xxd -l 128 "$SRC_FILE") <(xxd -l 128 "$REST_FILE") || true

          echo "--------------------------------------------------"
          echo "=== 3. Hex diff of LAST 128 bytes ==="
          diff -u <(tail -c 128 "$SRC_FILE" | xxd) <(tail -c 128 "$REST_FILE" | xxd) || true

          exit 1
        fi

    # =================================================================
    # 失敗時デバッグ用 (upload-artifact@v5 に更新)
    # =================================================================
    - name: Archive Failure Debug Artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: integrity-failure-debug-files
        path: |
          test_workspace/
          resultVideos*/**
          resultFiles*/**

    # =================================================================
    # ビルド成果物保存 (upload-artifact@v5 に更新)
    # =================================================================
    - name: Tar & Zstd compression
      run: |
        tar cvf target.tar target
        
    - name: Archive Build Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: FilesToVideosConverter-macos-arm64
        path: target.tar
